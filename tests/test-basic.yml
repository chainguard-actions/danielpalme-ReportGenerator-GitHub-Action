name: Test basic report generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q .; then
            dotnet --version
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Clean output
        run: rm -rf "$GITHUB_WORKSPACE/out-basic"
      - id: action
        uses: .
        with:
          reports: tests/fixtures/cobertura.xml
          targetdir: out-basic
          reporttypes: Html;TextSummary;JsonSummary
      - name: Assert reports generated
        run: |
          set -e
          ls -la "$GITHUB_WORKSPACE/out-basic"
          for f in index.html Summary.txt Summary.json; do
            if [ ! -f "$GITHUB_WORKSPACE/out-basic/$f" ]; then
              echo "FAIL: $f missing"
              exit 1
            fi
          done
          cat "$GITHUB_WORKSPACE/out-basic/Summary.txt"
          if ! grep -qE 'Line coverage:[[:space:]]*75' "$GITHUB_WORKSPACE/out-basic/Summary.txt"; then
            echo "FAIL: expected 75% line coverage"
            exit 1
          fi
          if ! grep -q 'Sample.Calculator' "$GITHUB_WORKSPACE/out-basic/Summary.txt"; then
            echo "FAIL: expected Sample.Calculator in summary"
            exit 1
          fi
          echo "PASS"
