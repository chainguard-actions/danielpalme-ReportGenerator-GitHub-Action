name: Test basic usage - generate HTML report from Cobertura XML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.x'

      - name: Copy coverage fixture into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        with:
          reports: 'coverage.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Cobertura'
          verbosity: 'Info'

      - name: Assert report directory was created
        run: |
          echo "Checking for coveragereport directory..."
          if [ ! -d "$GITHUB_WORKSPACE/coveragereport" ]; then
            echo "FAIL: coveragereport directory was not created"
            exit 1
          fi
          echo "PASS: coveragereport directory exists"

      - name: Assert HTML report was generated
        run: |
          echo "Checking for HTML report files..."
          HTML_COUNT=$(find "$GITHUB_WORKSPACE/coveragereport" -name "*.htm" -o -name "*.html" | wc -l)
          echo "HTML files found: $HTML_COUNT"
          if [ "$HTML_COUNT" -eq 0 ]; then
            echo "FAIL: No HTML report files found in coveragereport/"
            ls -la "$GITHUB_WORKSPACE/coveragereport/" || true
            exit 1
          fi
          echo "PASS: HTML report files found"

      - name: Assert Cobertura report was generated
        run: |
          echo "Checking for Cobertura XML report..."
          if [ ! -f "$GITHUB_WORKSPACE/coveragereport/Cobertura.xml" ]; then
            echo "FAIL: Cobertura.xml not found in coveragereport/"
            ls -la "$GITHUB_WORKSPACE/coveragereport/" || true
            exit 1
          fi
          echo "PASS: Cobertura.xml found"
