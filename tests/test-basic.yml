name: Test basic report generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -qE '^(8|9|10)\.'; then
            dotnet --version
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          reports: tests/fixtures/coverage.cobertura.xml
          targetdir: out-basic/report
          reporttypes: Html;TextSummary
          toolpath: out-basic/tool
          title: Basic Test
      - name: Assert reports generated
        run: |
          ls -la out-basic/report || true
          if [ ! -f out-basic/report/index.html ]; then
            echo "FAIL: index.html not generated"
            exit 1
          fi
          if [ ! -f out-basic/report/Summary.txt ]; then
            echo "FAIL: Summary.txt not generated"
            exit 1
          fi
          cat out-basic/report/Summary.txt
          if ! grep -q "MyLib.Calculator" out-basic/report/Summary.txt; then
            echo "FAIL: Calculator class missing from summary"
            exit 1
          fi
          if ! grep -q "MyLib.Helper" out-basic/report/Summary.txt; then
            echo "FAIL: Helper class missing from summary"
            exit 1
          fi
          if ! grep -qE "Line coverage:\s*50%" out-basic/report/Summary.txt; then
            echo "FAIL: expected 50% line coverage"
            exit 1
          fi
          if [ ! -x out-basic/tool/reportgenerator ]; then
            echo "FAIL: tool not installed into toolpath"
            exit 1
          fi
          echo "PASS"
