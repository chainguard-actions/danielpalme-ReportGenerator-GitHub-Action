name: Test targetdir path traversal is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q .; then
            dotnet --version
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Clean
        run: rm -rf "$GITHUB_WORKSPACE/../escaped-report-target"
      - id: action
        uses: .
        continue-on-error: true
        with:
          reports: tests/fixtures/cobertura.xml
          targetdir: ../escaped-report-target
          reporttypes: TextSummary
      - name: Assert action failed and wrote nothing outside workspace
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for targetdir outside workspace"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/../escaped-report-target/Summary.txt" ]; then
            echo "FAIL: report written outside workspace"
            exit 1
          fi
          echo "PASS"
