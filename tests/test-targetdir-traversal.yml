name: Test targetdir path traversal is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -qE '^(8|9|10)\.'; then
            dotnet --version
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          reports: tests/fixtures/coverage.cobertura.xml
          targetdir: ../../rg-escaped-report
          reporttypes: TextSummary
          toolpath: out-trav/tool
      - name: Assert action failed and wrote nothing outside workspace
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for targetdir outside workspace"
            exit 1
          fi
          ESCAPED="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/rg-escaped-report"
          if [ -e "$ESCAPED" ]; then
            echo "FAIL: report written outside workspace at $ESCAPED"
            exit 1
          fi
          echo "PASS"
