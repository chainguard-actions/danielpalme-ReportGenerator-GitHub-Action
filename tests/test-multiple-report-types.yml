name: Test multiple report types generated in one run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install .NET SDK
        run: |
          wget -q https://dot.net/v1/dotnet-install.sh -O /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Copy fixture coverage file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        with:
          reports: coverage.xml
          targetdir: multireport
          reporttypes: TextSummary;JsonSummary;Cobertura
          verbosity: Info
          title: 'Multi-Format Coverage Report'

      - name: Assert report directory was created
        run: |
          echo "Checking multireport directory..."
          if [ ! -d "$GITHUB_WORKSPACE/multireport" ]; then
            echo "FAIL: multireport directory was not created"
            exit 1
          fi
          echo "PASS: multireport directory exists"
          echo "--- Directory contents ---"
          ls -la "$GITHUB_WORKSPACE/multireport/"

      - name: Assert TextSummary report was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/multireport/Summary.txt" ]; then
            echo "FAIL: Summary.txt not found"
            exit 1
          fi
          echo "PASS: Summary.txt found"

      - name: Assert JsonSummary report was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/multireport/Summary.json" ]; then
            echo "FAIL: Summary.json not found"
            exit 1
          fi
          echo "PASS: Summary.json found"

      - name: Assert Cobertura report was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/multireport/Cobertura.xml" ]; then
            echo "FAIL: Cobertura.xml not found"
            exit 1
          fi
          echo "PASS: Cobertura.xml found"

      - name: Assert all three report types were generated
        run: |
          echo "All three report types verified successfully"
          echo "TextSummary: $(wc -c < "$GITHUB_WORKSPACE/multireport/Summary.txt") bytes"
          echo "JsonSummary: $(wc -c < "$GITHUB_WORKSPACE/multireport/Summary.json") bytes"
          echo "Cobertura: $(wc -c < "$GITHUB_WORKSPACE/multireport/Cobertura.xml") bytes"
          echo "PASS: All report types generated"
