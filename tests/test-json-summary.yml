name: Test JsonSummary report type with filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.x'

      - name: Copy coverage fixture into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        with:
          reports: 'coverage.xml'
          targetdir: 'jsonreport'
          reporttypes: 'JsonSummary'
          assemblyfilters: '+*;-System*'
          classfilters: '+*'
          filefilters: '+*'
          verbosity: 'Warning'

      - name: Assert JSON summary report was generated
        run: |
          echo "Checking for JsonSummary report..."
          if [ ! -f "$GITHUB_WORKSPACE/jsonreport/Summary.json" ]; then
            echo "FAIL: Summary.json not found in jsonreport/"
            ls -la "$GITHUB_WORKSPACE/jsonreport/" || true
            exit 1
          fi
          echo "PASS: Summary.json found"

      - name: Assert JSON summary is valid JSON
        run: |
          echo "Validating JSON content..."
          CONTENT=$(cat "$GITHUB_WORKSPACE/jsonreport/Summary.json")
          echo "Content preview: ${CONTENT:0:200}"
          if ! echo "$CONTENT" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: Summary.json is not valid JSON"
            exit 1
          fi
          echo "PASS: Summary.json is valid JSON"
