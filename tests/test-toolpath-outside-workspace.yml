name: Test toolpath outside workspace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          reports: tests/fixtures/cobertura.xml
          targetdir: out-evil
          toolpath: /etc/evil-reportgenerator-tool
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for toolpath outside workspace"
            exit 1
          fi
          if [ -e /etc/evil-reportgenerator-tool ]; then
            echo "FAIL: tool was installed outside the workspace"
            exit 1
          fi
          echo "PASS"
