name: Test classfilters and badges
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q .; then
            dotnet --version
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Clean output
        run: rm -rf "$GITHUB_WORKSPACE/out-filters"
      - id: action
        uses: .
        with:
          reports: tests/fixtures/cobertura.xml
          targetdir: out-filters
          reporttypes: TextSummary;Badges
          classfilters: -Sample.ExcludedHelper
          title: Filter Test
          verbosity: Verbose
      - name: Assert class excluded and badges created
        run: |
          set -e
          ls -la "$GITHUB_WORKSPACE/out-filters"
          cat "$GITHUB_WORKSPACE/out-filters/Summary.txt"
          if grep -q 'Sample.ExcludedHelper' "$GITHUB_WORKSPACE/out-filters/Summary.txt"; then
            echo "FAIL: excluded class still present"
            exit 1
          fi
          if ! grep -q 'Sample.Calculator' "$GITHUB_WORKSPACE/out-filters/Summary.txt"; then
            echo "FAIL: included class missing"
            exit 1
          fi
          if ! grep -qE 'Line coverage:[[:space:]]*100' "$GITHUB_WORKSPACE/out-filters/Summary.txt"; then
            echo "FAIL: expected 100% line coverage after filtering"
            exit 1
          fi
          if ! ls "$GITHUB_WORKSPACE/out-filters"/badge_*.svg >/dev/null 2>&1; then
            echo "FAIL: no badge svg files generated"
            exit 1
          fi
          echo "PASS"
