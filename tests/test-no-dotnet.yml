name: Test error handling when .NET SDK is not available
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture coverage file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - name: Create fake dotnet that always fails
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fake-bin"
          printf '#!/bin/sh\nexit 1\n' > "$GITHUB_WORKSPACE/fake-bin/dotnet"
          chmod +x "$GITHUB_WORKSPACE/fake-bin/dotnet"
          # Prepend fake-bin to PATH so it takes precedence over any real dotnet
          echo "$GITHUB_WORKSPACE/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        continue-on-error: true
        with:
          reports: coverage.xml
          targetdir: nodotnetreport
          reporttypes: TextSummary
          verbosity: Info

      - name: Assert action failed gracefully when .NET SDK is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when .NET SDK is not available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when .NET SDK is not available"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
