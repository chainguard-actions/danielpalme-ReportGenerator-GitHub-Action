name: Test invalid toolpath - path traversal protection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.x'

      - name: Copy coverage fixture into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          reports: 'coverage.xml'
          targetdir: 'coveragereport'
          reporttypes: 'TextSummary'
          toolpath: '../../../etc/malicious'

      - name: Assert action failed due to invalid toolpath
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid toolpath, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with path traversal toolpath"
