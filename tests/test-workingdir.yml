name: Test workingdir resolution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q .; then
            dotnet --version
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Prepare working directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/wd-test"
          mkdir -p "$GITHUB_WORKSPACE/wd-test"
          cp "$GITHUB_WORKSPACE/tests/fixtures/cobertura.xml" "$GITHUB_WORKSPACE/wd-test/coverage.cobertura.xml"
      - id: action
        uses: .
        with:
          workingdir: wd-test
          reports: coverage.cobertura.xml
          targetdir: report
          reporttypes: Cobertura;TextSummary
      - name: Assert output written relative to workingdir
        run: |
          set -e
          ls -laR "$GITHUB_WORKSPACE/wd-test"
          for f in Cobertura.xml Summary.txt; do
            if [ ! -f "$GITHUB_WORKSPACE/wd-test/report/$f" ]; then
              echo "FAIL: wd-test/report/$f missing"
              exit 1
            fi
          done
          if [ -e "$GITHUB_WORKSPACE/report/Summary.txt" ]; then
            echo "FAIL: report was written to workspace root instead of workingdir"
            exit 1
          fi
          echo "PASS"
